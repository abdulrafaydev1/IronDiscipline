name: Build IronDiscipline Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -o pipefail
          mkdir -p build_logs
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_logs/gradle_build.log

      - name: Dump Failure Log to Console and Summary
        if: failure()
        run: |
          echo "=== GRADLE FAILURE DETECTED ==="
          tail -n 80 build_logs/gradle_build.log
          echo "### Gradle Build Failure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "e: |FAILURE:|Caused by:|ERROR:" -C 4 build_logs/gradle_build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronDiscipline-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
