name: Build IronDiscipline Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || {
            echo "::error::Gradle assembleDebug failed!"
            grep -E -C 3 -i "(error:|failure:|exception|cannot find|unresolved reference|failed)" build.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronDiscipline-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
