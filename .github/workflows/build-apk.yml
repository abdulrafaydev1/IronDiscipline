name: Build IronDiscipline Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          mkdir -p build_logs
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build_logs/gradle_build.log || (echo "=== GRADLE FAILURE LOG ===" && tail -n 150 build_logs/gradle_build.log && exit 1)

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build_logs/

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronDiscipline-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
